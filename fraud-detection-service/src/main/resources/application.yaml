spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: ${FRAUD_DETECTION_SERVICE_REDIS_HOST}
      port: ${FRAUD_DETECTION_SERVICE_REDIS_PORT}

  kafka:
    bootstrap-servers: ${FRAUD_DETECTION_SERVICE_BOOTSTRAP_SERVER}
    consumer:
      group-id: fraud-detection-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: ${FRAUD_DETECTION_SERVICE_SERVER_PORT}

# acc service url for feign client
account:
  service:
    url: ${FRAUD_DETECTION_ACCOUNT_SERVICE_URL}

fraud:
  max-transaction-per-minumte: ${FRAUD_MAX_TRANSACTION_PER_MIN}
  suspicious-amount-multiplier: ${FRAUD_SUSPICIOUS_AMOUNT_MULTIPLIER}
  max-balance-percentage: ${FRAUD_BALANCE_PERCENTAGE}

management:
  endpoints:
    web:
      exposure:
        include: health, info

