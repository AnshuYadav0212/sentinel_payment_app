spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:

        # Account servicde routes
        - id: account-service
          url: http://localhost:8081
          predicates:
            - Path=/api/v1/account/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter-replenishRate: 10
                redis-rate-limiter-burstCapacity: 25

        # transaction servicde routes
        - id: transaction-service
          url: http://localhost:8082
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter-replenishRate: 10
                redis-rate-limiter-burstCapacity: 25


            # payments servicde routes
            - id: payment-service
              url: http://localhost:8083
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter-replenishRate: 5
                    redis-rate-limiter-burstCapacity: 15

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

